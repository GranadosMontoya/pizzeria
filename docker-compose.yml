services:
  web:
    build: .
    container_name: pizzeria-web
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      DJANGO_DB_PATH: /data/db.sqlite3
    volumes:
      - pizzeria_data:/data      # aquí vive la base de datos; sobrevive a los redespliegues
    networks:
      - proxy                    # solo para que Nginx Proxy Manager lo encuentre; no abre puertos al exterior

volumes:
  pizzeria_data:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK}
