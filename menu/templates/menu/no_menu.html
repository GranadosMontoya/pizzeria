<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>¿Buscas un menú?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #F2F3EF; --ink: #1B1D1A; --muted: #5C6159; --line: #D8DBD2; --surface: #FFFFFF;
      --tomato: #CF3420; --glow: rgba(207, 52, 32, .10);
      --loza: #FFFFFF; --aro: #CF3420; --centro: #F2F3EF; --cubierto: #8A8F86; --sombra: rgba(20, 22, 18, .12);
      --f-display: 'Bricolage Grotesque', 'Arial Narrow', system-ui, sans-serif;
      --f-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151714; --ink: #F1F2EC; --muted: #A5AAA0; --line: #363A32; --surface: #1F221D;
        --tomato: #FF6A4D; --glow: rgba(255, 106, 77, .12);
        --loza: #2A2E27; --aro: #FF6A4D; --centro: #1F221D; --cubierto: #A5AAA0; --sombra: rgba(0, 0, 0, .45);
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(60rem 30rem at 50% -8%, var(--glow), transparent 70%), var(--bg);
      color: var(--ink); font-family: var(--f-body); line-height: 1.55; text-align: center;
    }
    main { width: 100%; max-width: 26rem; }
    .logo { display: block; margin: 0 auto 8px; max-width: 70vw; height: auto; overflow: visible; }
    .loza { fill: var(--loza); stroke: var(--line); stroke-width: 2; }
    .aro { fill: none; stroke: var(--aro); stroke-width: 3; }
    .centro { fill: var(--centro); }
    .cubierto { fill: var(--cubierto); }
    .sombra { fill: var(--sombra); }
    .plato { animation: flota 3.6s ease-in-out infinite; transform-origin: 120px 100px; }
    @keyframes flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    h1 { margin: 12px 0 10px; font-family: var(--f-display); font-weight: 800; font-size: clamp(1.75rem, 7vw, 2.25rem); line-height: 1.1; letter-spacing: -.01em; text-wrap: balance; }
    p { margin: 0 auto; max-width: 24rem; color: var(--muted); font-size: 1.0625rem; text-wrap: pretty; }
    @media (prefers-reduced-motion: reduce) { .plato { animation: none; } }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 240 200" role="img" aria-label="Un plato con cubiertos" width="260" height="217">
      <ellipse cx="120" cy="184" rx="78" ry="8" class="sombra"/>
      <g class="plato">
        <circle cx="120" cy="100" r="72" class="loza"/>
        <circle cx="120" cy="100" r="50" class="aro"/>
        <circle cx="120" cy="100" r="40" class="centro"/>
      </g>
      <g class="cubierto" transform="translate(40 34)">
        <rect x="-10.5" y="0" width="3" height="36" rx="1.5"/><rect x="-3.5" y="0" width="3" height="36" rx="1.5"/>
        <rect x="3.5" y="0" width="3" height="36" rx="1.5"/><rect x="10.5" y="0" width="3" height="36" rx="1.5"/>
        <path d="M-10.5 30H13.5V36C13.5 46 6 50 1.5 50C-3 50 -10.5 46 -10.5 36Z"/>
        <rect x="-1" y="48" width="5" height="92" rx="2.5"/>
      </g>
      <g class="cubierto" transform="translate(200 34)">
        <path d="M-3 0C9 3 12 24 9 56H-3Z"/>
        <rect x="-3" y="54" width="12" height="86" rx="5"/>
      </g>
    </svg>
    <h1>¿Buscas un menú?</h1>
    <p>Entra con el enlace o el código QR que te compartió el negocio y verás su menú al instante.</p>
  </main>
</body>
</html>
